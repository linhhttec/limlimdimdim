<label>Danh mục<select id="ed-cat"></select></label>
<label>Giá chung (nghìn đồng)<input id="ed-price" type="text" inputmode="numeric" placeholder="VD: 350. Để trống nếu nhắn shop báo giá"></label>
<div class="vset"><label>Phân loại sản phẩm<select id="ed-vt"><option value="">Không có phân loại</option><option value="size">Size</option><option value="color">Màu sắc</option><option value="custom">Khác (tự đặt tên)</option></select></label>
<label id="ed-vn-w" hidden="">Tên phân loại<input id="ed-vn" type="text" maxlength="30" placeholder="VD: Kiểu quai, Mẫu vải"></label>
<div id="ed-vopts"></div><button type="button" class="edbtn" id="ed-vadd" hidden="">+ Thêm lựa chọn</button>

<label>Tag đính kèm<select id="ed-tag"><option value="">Không có tag</option><option value="best">Best seller</option><option value="soldout">Hết hàng (Sold out)</option></select></label>
<div class="edimg"><span>Ảnh chính</span><div class="edrow"><img id="ed-img" alt=""><label class="edbtn">Chọn ảnh<input id="ed-file" type="file" accept="image/*" hidden=""></label></div></div>
<div class="edimg"><span>Ảnh phụ (hiện khi bấm vào sản phẩm)</span><div class="edrow" id="ed-thumbs"></div><label class="edbtn">+ Thêm ảnh phụ<input id="ed-more" type="file" accept="image/*" multiple="" hidden=""></label></div>
<p id="ed-err" role="alert"></p>
<div class="edact"><button type="button" id="ed-ok">Xong</button><button type="button" id="ed-cancel">Hủy</button><button type="button" id="ed-del">Xóa sản phẩm</button></div>
</div></dialog>
